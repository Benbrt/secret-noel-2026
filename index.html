<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le Secret de Noël 2026</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at top,#285c43,#123c2e 68%,#0a241b);color:#f6f0e5;font-family:Georgia,serif}main{width:min(100%,460px);border:1px solid #d6b36b66;border-radius:25px;padding:30px 24px;text-align:center;background:#ffffff0b;box-shadow:0 22px 70px #0005}.top{color:#d6b36b;font-size:12px;letter-spacing:.17em}h1{font-weight:normal;font-size:38px;line-height:1.1;margin:18px 0}.orn{font-size:32px;margin:18px}p{line-height:1.55;color:#e9ddc5}.rule{height:1px;background:linear-gradient(90deg,transparent,#d6b36b,transparent);margin:24px 0}label{display:block;text-align:left;color:#d6b36b;margin:12px 0 7px}select,input{width:100%;padding:14px;border-radius:12px;border:1px solid #c9a45d88;background:#f7f1e7;color:#17352a;font-size:16px}button{margin-top:20px;width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#e5c47e,#c99b49);color:#143628;font-weight:bold;font-family:inherit;font-size:17px;padding:17px;cursor:pointer}#result{display:none;margin-top:22px;border:1px solid #d9b56d88;border-radius:18px;padding:24px;background:#ffffff0a}.small{font-size:12px;color:#d6b36b;letter-spacing:.15em}.recipient{font-size:34px;color:#f3d68e;margin:14px}.error{color:#ffd1c4;margin-top:12px;display:none}.foot{font-size:12px;color:#c9bca5;margin-top:22px}</style><main><div class="top">✦ Noël en famille · 2026 ✦</div><h1>Le Secret<br>de Noël</h1><div class="orn">🎄 ✨ 🎁</div><p>Un cadeau, une attention, un secret.<br>Découvre la personne que tu vas gâter.</p><div class="rule"></div><label>Je suis…</label><select id="person"><option value="">Choisir mon prénom</option></select><label>Mon code secret</label><input id="code" maxlength="12" placeholder="Saisir mon code"><button id="draw">Qui vais-je gâter cette année ?</button><div id="error" class="error"></div><section id="result"><div class="small">Ton secret de Noël</div><div class="recipient" id="recipient"></div><p>Chut… c'est un secret ! 🤫</p></section><div class="foot">Tirage familial · Un destinataire unique pour chacun</div></main><script>
const data={"Papa": {"recipient": "Henri", "code": "BL2G9S"}, "Maman": {"recipient": "Sibylle", "code": "PKLNLU"}, "Baudouin": {"recipient": "Foucauld", "code": "DHFBDD"}, "Cyriaque": {"recipient": "Jacinthe", "code": "ZC94G8"}, "Amaury": {"recipient": "Cyriaque", "code": "MP2LZ0"}, "Foucauld": {"recipient": "Papa", "code": "9BGBKO"}, "Sixtine": {"recipient": "Amaury", "code": "43G0CM"}, "Sibylle": {"recipient": "Baudouin", "code": "LSU1S8"}, "Jacinthe": {"recipient": "Maman", "code": "VVH12G"}, "Henri": {"recipient": "Sixtine", "code": "P84CMR"}};const s=document.getElementById('person'),b=document.getElementById('draw');Object.keys(data).forEach(p=>{let o=document.createElement('option');o.value=p;o.textContent=p;s.append(o)});b.onclick=()=>{let p=s.value,c=document.getElementById('code').value.trim().toUpperCase(),e=document.getElementById('error');e.style.display='none';document.getElementById('result').style.display='none';if(!p||!c){e.textContent='Choisis ton prénom et saisis ton code.';e.style.display='block';return}if(data[p].code!==c){e.textContent='Code incorrect. Vérifie ton message personnel.';e.style.display='block';return}document.getElementById('recipient').textContent=data[p].recipient;document.getElementById('result').style.display='block';s.disabled=true;document.getElementById('code').disabled=true;b.disabled=true;b.textContent='Secret dévoilé 🎁'};
</script></html>
